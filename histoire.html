<body>
<div class="top">
 <div class="bar">
  <a class="home" href="./">← Accueil</a>
  <b>Histoire du personnage</b>
  <span id="msg" role="status"></span>
  <button class="primary" id="bSave">Enregistrer (.txt)</button>
  <button id="bPrint">Imprimer</button>
  <button id="bClear">Vider</button>
 </div>
 <div class="persos" id="persos"></div>
</div>

<div id="book" class="wrap">
 <main class="sheet">
  <div class="hero">
   <input id="titre" placeholder="Nom du personnage" aria-label="Nom du personnage">
   <p id="sum"></p>
  </div>
  <p class="intro noprint">Écris ici l’histoire de ton personnage : d’où il vient, ce qui l’a poussé à l’aventure, ce qu’il cherche. Tout est enregistré automatiquement avec le personnage, et part avec lui quand tu l’exportes depuis l’accueil. Remplis seulement les parties qui te servent.</p>
  <div id="secs"></div>
 </main>
</div>

<script src="assets/js/persos.js?v=20261015a"></script>
