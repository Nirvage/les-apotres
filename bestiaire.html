<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bestiaire D&amp;D 5e</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261014c">
<link rel="stylesheet" href="assets/css/pages/bestiaire.css?v=20261022r">
<script src="assets/js/theme.js?v=20261022s"></script>
<script src="assets/js/vo.js?v=20261022s"></script>
</head>
<body>
<div class="top">
 <div class="bar">
  <a class="home" href="./">← Accueil</a>
  <b>Bestiaire D&amp;D 5e</b>
  <span id="msg" role="status"></span>
  <button id="bRand">Monstre au hasard</button>
  <button id="bClose">Tout replier</button>
 </div>
</div>

<div class="wrap">
 <section class="panel">
  <h2>Rechercher un monstre</h2>
  <div class="fgrid">
   <label><small>Nom (français ou anglais)</small><input id="fq" type="search" placeholder="Gobelin, dragon rouge, owlbear…"></label>
   <label><small>Type de créature</small><select id="ft"></select></label>
   <label><small>Taille</small><select id="fs"></select></label>
   <label><small>Version</small><select id="fv"><option value="">Toutes</option><option value="2024">2024 (SRD 5.2)</option><option value="2014">2014 (SRD 5.1)</option></select></label>
  </div>
  <div class="fgrid2">
   <label><small>FP minimum</small><select id="fmin"></select></label>
   <label><small>FP maximum</small><select id="fmax"></select></label>
   <label><small>Particularité</small><select id="fx"><option value="">Aucune</option><option value="leg">Actions légendaires</option><option value="sort">Lanceur de sorts</option><option value="vol">Peut voler</option><option value="nage">Peut nager</option></select></label>
   <label><small>Trier par</small><select id="fo"><option value="nom">Nom</option><option value="fp">FP croissant</option><option value="fpd">FP décroissant</option></select></label>
  </div>
  <div class="fbar">
   <span class="cnt" id="cnt"></span>
   <button class="b" id="bReset">Réinitialiser les filtres</button>
  </div>
 </section>
 <div class="list" id="list"><div class="empty-msg">Chargement du bestiaire…</div></div>
</div>

<script src="assets/js/page-utils.js?v=20261022r"></script>
<script src="assets/js/pages/bestiaire.js?v=20261022t"></script>
<script src="assets/js/recherche.js?v=20261022s"></script>
<script src="assets/js/sw-register.js?v=20261022s"></script>
</body>
</html>
