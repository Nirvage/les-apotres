<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Grimoire D&amp;D 5e</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261014c">
<link rel="stylesheet" href="assets/css/pages/grimoire.css?v=20261022r">
<script src="assets/js/theme.js?v=20261022s"></script>
<script src="assets/js/vo.js?v=20261022s"></script>
</head>
<body data-mode="choose">
<div class="top">
 <div class="bar">
  <a class="home" href="./">← Accueil</a>
  <b>Grimoire D&amp;D 5e</b>
  <span id="msg" role="status"></span>
  <button data-act="mode" data-m="choose" aria-pressed="true">Choisir les sorts</button>
  <button data-act="mode" data-m="book" aria-pressed="false" id="bBook">Mon grimoire (0)</button>
  <button class="primary" id="bSave">Enregistrer (.json)</button>
  <button id="bLoad">Charger un .json</button>
  <button id="bPrint">Imprimer</button>
  <button id="bClear">Vider</button>
  <input type="file" id="file" accept="application/json,.json" hidden>
 </div>
 <div class="persos" id="persos"></div>
</div>

<!-- CHOISIR -->
<div id="choose" class="wrap">
 <section class="panel">
  <h2>Rechercher des sorts</h2>
  <div class="fgrid">
   <label><small>Nom</small><input id="fq" type="search" placeholder="Boule de feu, soins…"></label>
   <label><small>Classe</small><select id="fc"></select></label>
   <label><small>Type de sort (école)</small><select id="fs"></select></label>
   <label><small>Niveau</small><select id="fl"></select></label>
  </div>
  <div class="fbar">
   <span class="cnt" id="cnt"></span>
   <label>Source&nbsp;<select id="fb"><option value="">toutes</option><option value="base">Manuel des joueurs 2024</option><option value="nouv">nouveautés 5.5 (Heroes of Faerûn, 2026…)</option><option value="2014">anciens livres, version 2014</option></select></label>
   <label>Afficher&nbsp;<select id="fo"><option value="">tous les sorts</option><option value="1">ma sélection</option><option value="p">sorts préparés</option></select></label>
   <button class="b" id="bReset">Réinitialiser les filtres</button>
  </div>
 </section>
 <div class="list" id="list"><div class="empty-msg">Chargement des sorts…</div></div>
</div>

<!-- GRIMOIRE -->
<div id="book" class="wrap">
 <main class="sheet">
  <div class="hero">
   <input id="titre" placeholder="Nom du personnage" aria-label="Nom du personnage">
   <p id="sum"></p>
  </div>
  <section class="prep" id="prep" aria-label="Sorts préparés"></section>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="levels"></div>
 </main>
</div>

<script src="assets/js/persos.js?v=20261022s"></script>
<script src="assets/js/page-utils.js?v=20261022r"></script>
<script src="assets/js/pages/grimoire.js?v=20261022v"></script>
<script src="assets/js/recherche.js?v=20261022s"></script>
<script src="assets/js/sw-register.js?v=20261022s"></script>
</body>
</html>
