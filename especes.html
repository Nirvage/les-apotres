<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Espèces D&amp;D 5e</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261014c">

<body>
<div class="top">
 <div class="bar">
  <a class="home" href="./">← Accueil</a>
  <b>Espèces D&amp;D 5e</b>
  <span id="msg" role="status"></span>
 </div>
</div>

<div class="wrap">
 <section class="panel">
  <h2>Toutes les espèces jouables</h2>
  <div class="fgrid">
   <label><small>Nom ou pouvoir</small><input id="fq" type="search" placeholder="Elfe, vol, téléportation, poison…"></label>
   <label><small>Règles</small><select id="fe"></select></label>
   <label><small>Taille</small><select id="ft"></select></label>
   <label><small>Type de créature</small><select id="fy"></select></label>
   <label><small>Particularité</small><select id="fp"></select></label>
  </div>
  <div class="fbar">
   <span class="cnt" id="cnt"></span>
   <button class="b" id="bAll">Tout déplier</button>
   <button class="b" id="bReset">Réinitialiser les filtres</button>
  </div>
 </section>
 <div class="list" id="list"><div class="empty-msg">Chargement des espèces…</div></div>
</div>

<script src="assets/js/page-utils.js?v=20261022r"></script>
<script src="assets/js/pages/especes.js?v=20261022t"></script>
