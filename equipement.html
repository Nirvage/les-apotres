<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Équipement D&amp;D 5e</title>
<link rel="stylesheet" href="style.css">
<style>
@page{size:A4;margin:10mm}
.wrap{max-width:1000px;margin:16px auto;padding:0 12px}
body[data-mode=choose] #book,body[data-mode=book] #choose{display:none}

/* Filtres */
.panel{padding:10px 14px 12px}
.panel h2{font:italic 700 16px var(--serif);color:#2a3170;margin:0 0 8px}
.fgrid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px 14px;align-items:end}
small{display:block;font-size:11px;color:var(--soft);margin-bottom:2px}
.fgrid input,.fgrid select{width:100%;border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:#fff}
.fbar{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:12px;color:var(--soft)}
.fbar .cnt{margin-right:auto;font-weight:600;color:#2a3170}
.fbar label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--soft)}
.fbar select{border:1px solid var(--line);border-radius:5px;padding:5px 8px;background:#fff;font-size:12px;color:var(--ink);cursor:pointer}
.b{border:1.5px solid var(--c,#2a3170);background:#fff;color:var(--c,#2a3170);border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:600;font-size:12px}
.b:hover{background:color-mix(in srgb,var(--c,#2a3170) 10%,#fff)}
.b.add{--c:#2e9e5b}.b.add.on{background:#2e9e5b;color:#fff}
.b.rm{--c:#c8402f}

/* Liste de choix */
.list{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.item{background:#fff;border-radius:9px;box-shadow:0 1px 6px #0003;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-left:6px solid var(--c)}
.rmain{flex:1;min-width:0}
.rt{font:italic 700 15px var(--serif)}
.rs{font-size:11.5px;color:var(--soft)}
.racts{display:flex;gap:6px;flex:none}
.det{padding:0 10px 10px;border-left:6px solid var(--c)}
.empty-msg{background:#fff;border-radius:9px;padding:18px;text-align:center;color:var(--soft)}
.srcn{margin-top:6px;font-size:10px;color:var(--soft);font-style:italic}
.pill{display:inline-block;font:600 10px system-ui;border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:middle;color:#fff;font-style:normal}
.qty{display:inline-flex;align-items:center;gap:4px;font-weight:700}.qty button{width:26px;height:26px;padding:0}.qin{width:56px;padding:4px;text-align:center;border:1px solid var(--line);border-radius:5px;font-weight:700}
.tot{margin-top:10px;padding:8px 12px;border-radius:8px;background:#eef0fb;color:#2a3170;font-weight:600;font-size:13px}
.pr{font-size:11.5px;font-weight:600;color:#2a3170;white-space:nowrap}

/* Fiche de sort */
.sp{--c:#2a3170;border:1.5px solid var(--c);border-radius:9px;overflow:hidden;background:color-mix(in srgb,var(--c) 6%,#fff);break-inside:avoid;page-break-inside:avoid}
.sp header{display:flex;align-items:center;gap:8px;background:var(--c);color:#fff;padding:5px 9px}
.sp .ti{flex:1;min-width:0}
.sp h3{margin:0;font:italic 700 15px/1.15 var(--serif)}
.sp .sub{font-size:10.5px;opacity:.92}
.lvb{flex:none;min-width:26px;height:26px;border-radius:13px;padding:0 7px;background:#fff;color:var(--c);font:700 11px/26px system-ui;text-align:center;white-space:nowrap}
.sp .body{padding:6px 9px 8px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;margin:0 0 6px;padding-bottom:5px;border-bottom:1px dashed var(--c)}
.meta div{min-width:0}
.meta dt{font:700 10px system-ui;color:var(--c);text-transform:none}
.meta dd{margin:0;font-size:11.5px}
.desc{font-size:12px;line-height:1.4}
.desc table{border-collapse:collapse;margin:4px 0;width:100%;font-size:.95em}
.desc th,.desc td{border:1px solid color-mix(in srgb,var(--c) 45%,#fff);padding:1px 5px;text-align:left}
.desc th{background:color-mix(in srgb,var(--c) 18%,#fff)}
.sp .rm{margin-top:6px}

/* Grimoire */
.sheet{background:#fff;border-radius:10px;box-shadow:0 4px 24px #0005;padding:14px}
.hero input{width:100%;color:#fff;background:transparent;border:0;border-bottom:2px solid var(--gold);font:italic 700 26px var(--serif);padding:0 2px 2px}
.hero p{margin:4px 0 0;font-size:12px;color:#d9defa}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px}
.tab{--c:#2a3170;border:2px solid var(--c);background:#fff;color:var(--c);border-radius:999px;padding:4px 12px;font-weight:600;cursor:pointer}
.tab[aria-selected=true]{background:var(--c);color:#fff}
.tab span{opacity:.8;font-weight:400;margin-left:4px}
.lvl{--c:#2a3170}
.lvl:not(.on){display:none}
.lvl h2{margin:0 0 8px;background:var(--c);color:#fff;font:italic 700 15px var(--serif);padding:4px 12px;border-radius:7px}
.lvl h2 span{font:12px system-ui;opacity:.85}
.cards{display:flex;flex-direction:column;gap:10px}
.none{color:var(--soft);padding:14px;text-align:center}

@media screen and (max-width:760px){
 .fgrid{grid-template-columns:1fr 1fr}.fgrid>:first-child{grid-column:1/-1}
 .row{flex-wrap:wrap}
}
@media print{
 body{font-size:10px}
 #choose,.tabs,.none,.noprint{display:none!important}
 #book{display:block!important}
 .wrap{max-width:none;margin:0;padding:0}
 .sheet{box-shadow:none;border-radius:0;padding:0}
 .hero{margin-bottom:4mm;break-after:avoid;page-break-after:avoid}
 .lvl{display:block!important;margin-top:3mm}
 .lvl.empty{display:none!important}
 .lvl h2{break-after:avoid;page-break-after:avoid}
 .cards{display:block}
 .sp{display:block;margin:0 0 4mm;break-inside:avoid;page-break-inside:avoid}
 .desc{font-size:9.5px;line-height:1.35}
 .meta dd{font-size:9.5px}
}
</style>
</head>
<body data-mode="choose">
<div class="top">
 <div class="bar">
  <a class="home" href="./">← Accueil</a>
  <b>Équipement D&amp;D 5e</b>
  <span id="msg" role="status"></span>
  <button data-act="mode" data-m="choose" aria-pressed="true">Choisir l’équipement</button>
  <button data-act="mode" data-m="book" aria-pressed="false" id="bBook">Mon équipement (0)</button>
  <button class="primary" id="bSave">Enregistrer (.json)</button>
  <button id="bLoad">Charger un .json</button>
  <button id="bPrint">Imprimer / PDF</button>
  <button id="bClear">Vider</button>
  <input type="file" id="file" accept="application/json,.json" hidden>
 </div>
 <div class="persos" id="persos"></div>
</div>

<!-- CHOISIR -->
<div id="choose" class="wrap">
 <section class="panel">
  <h2>Rechercher de l’équipement</h2>
  <div class="fgrid">
   <label><small>Nom</small><input id="fq" type="search" placeholder="Potion de soins, épée longue, cotte de mailles…"></label>
   <label><small>Catégorie</small><select id="fc"></select></label>
   <label><small>Sous-catégorie</small><select id="fs"></select></label>
   <label><small>Prix maximum (po)</small><input id="fl" type="number" min="0" step="any" placeholder="illimité"></label>
  </div>
  <div class="fbar">
   <span class="cnt" id="cnt"></span>
      <label>Afficher&nbsp;<select id="fo"><option value="">tout l’équipement</option><option value="1">ma sélection</option></select></label>
   <button class="b" id="bReset">Réinitialiser les filtres</button>
  </div>
 </section>
 <div class="list" id="list"><div class="empty-msg">Chargement des objets…</div></div>
</div>

<!-- GRIMOIRE -->
<div id="book" class="wrap">
 <main class="sheet">
  <div class="hero">
   <input id="titre" placeholder="Nom de l’inventaire ou du personnage" aria-label="Nom de l’inventaire">
   <p id="sum"></p>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="levels"></div>
  <div class="tot" id="tot"></div>
 </main>
</div>

<script src="persos.js"></script>
<script>
const TC={'Arme':'#c8402f','Armure':'#2f6fd0','Munition':'#d8791a','Équipement d’aventurier':'#2e9e5b','Paquetage':'#12968f','Outil':'#7a4fc4','Monture et véhicule':'#8e5a2b'};
const TORDER=Object.keys(TC);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const msg=t=>{$('#msg').textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>$('#msg').textContent='',4500)};
const fmt=n=>(Math.round(n*100)/100).toLocaleString('fr-FR');
const fkg=n=>fmt(n)+' kg';
let DB=[];const BYN=new Map();
const st={sel:new Map(),q:'',cls:'',sch:'',lvl:'',only:'',tab:0,open:new Set()};
const qty=s=>st.sel.get(s.n)||0;

function setup(data){
  DB=data;
  DB.forEach((s,i)=>{s.i=i;s.idx=norm(s.n+' '+s.en+' '+s.c);[s.n,s.en].forEach(x=>{if(x&&!BYN.has(norm(x)))BYN.set(norm(x),s)})});
  $('#fc').innerHTML='<option value="">Toutes</option>'+TORDER.filter(t=>DB.some(s=>s.t===t)).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
  fillSub();
}
function fillSub(){
  const subs=[...new Set(DB.filter(s=>!st.cls||s.t===st.cls).map(s=>s.c))];
  if(st.sch&&!subs.includes(st.sch))st.sch='';
  $('#fs').innerHTML='<option value="">Toutes</option>'+subs.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
  $('#fs').value=st.sch;
}
function card(s,remove){
  const col=TC[s.t]||'#2a3170',q=qty(s);
  return `<article class="sp" style="--c:${col}"><header><div class="ti"><h3>${esc(s.n)}</h3><div class="sub">${esc(s.c)} · ${esc(s.en)}</div></div><span class="lvb">${remove?'× '+q:esc(s.p)}</span></header>
  <div class="body"><dl class="meta"><div><dt>Coût</dt><dd>${esc(s.p)}</dd></div><div><dt>Poids</dt><dd>${s.kg?fkg(s.kg):'—'}</dd></div><div><dt>Catégorie</dt><dd>${esc(s.c)}</dd></div><div><dt>Nom anglais</dt><dd>${esc(s.en)}</dd></div>${remove?`<div><dt>Quantité</dt><dd>${q} (total ${fkg(q*s.kg)} · ${fmt(q*s.po)} po)</dd></div>`:''}</dl>
  <div class="desc">${s.h}</div>${remove?`<div class="qty noprint" style="margin-top:6px"><button class="b" data-act="dec" data-i="${s.i}">−</button><input class="qin" type="number" min="1" max="999" value="${q}" data-i="${s.i}" aria-label="Quantité de ${esc(s.n)}"><button class="b" data-act="inc" data-i="${s.i}">+</button> <button class="b rm" data-act="rm" data-i="${s.i}">Retirer</button></div>`:''}</div></article>`;
}
function filtered(){
  const q=norm(st.q),max=st.lvl===''?null:parseFloat(st.lvl);
  return DB.filter(s=>(!q||s.idx.includes(q))&&(!st.cls||s.t===st.cls)&&(!st.sch||s.c===st.sch)&&(max===null||isNaN(max)||s.po<=max)&&(!st.only||qty(s)>0));
}
function totals(){let kg=0,po=0,n=0;DB.forEach(s=>{const q=qty(s);if(q){kg+=q*s.kg;po+=q*s.po;n+=q}});return{kg,po,n}}
function renderList(){
  const r=filtered(),t=totals();
  $('#cnt').textContent=r.length+' objet'+(r.length>1?'s':'')+' affiché'+(r.length>1?'s':'')+' · '+st.sel.size+' type'+(st.sel.size>1?'s':'')+' dans mon équipement';
  $('#list').innerHTML=r.length?r.map(s=>{
    const q=qty(s),op=st.open.has(s.n),col=TC[s.t]||'#2a3170';
    const act=q?`<span class="qty"><button class="b" data-act="dec" data-i="${s.i}" aria-label="Retirer un exemplaire">−</button><input class="qin" type="number" min="1" max="999" value="${q}" data-i="${s.i}" aria-label="Quantité de ${esc(s.n)}"><button class="b add on" data-act="inc" data-i="${s.i}" aria-label="Ajouter un exemplaire">+</button></span>`:`<button class="b add" data-act="inc" data-i="${s.i}">Ajouter</button>`;
    return `<div class="item" style="--c:${col}"><div class="row"><div class="rmain"><div class="rt">${esc(s.n)}</div><div class="rs">${esc(s.c)}${s.kg?' · '+fkg(s.kg):''}</div></div><span class="pr">${esc(s.p)}</span>
    <div class="racts"><button class="b" style="--c:#2a3170" data-act="det" data-i="${s.i}" aria-expanded="${op}">${op?'Masquer':'Détails'}</button>${act}</div></div>${op?`<div class="det">${card(s,false)}</div>`:''}</div>`;
  }).join(''):'<div class="empty-msg">Aucun objet ne correspond à ces filtres.</div>';
}
function renderBook(){
  const by=TORDER.map(()=>[]);
  DB.forEach(s=>{if(qty(s))by[TORDER.indexOf(s.t)].push(s)});
  by.forEach(a=>a.sort((x,y)=>x.c.localeCompare(y.c,'fr')||x.n.localeCompare(y.n,'fr')));
  $('#tabs').innerHTML=TORDER.map((t,l)=>`<button class="tab" role="tab" style="--c:${TC[t]}" data-act="tab" data-l="${l}" aria-selected="${l===st.tab}">${esc(t)}<span>${by[l].length}</span></button>`).join('');
  $('#levels').innerHTML=TORDER.map((t,l)=>`<section class="lvl${l===st.tab?' on':''}${by[l].length?'':' empty'}" style="--c:${TC[t]}"><h2>${esc(t)} <span>(${by[l].length})</span></h2>${by[l].length?`<div class="cards">${by[l].map(s=>card(s,true)).join('')}</div>`:'<div class="none">Aucun objet dans cette catégorie.</div>'}</section>`).join('');
  const t=totals();
  $('#sum').textContent=t.n?t.n+' objet'+(t.n>1?'s':'')+' · '+fkg(t.kg)+' · valeur '+fmt(t.po)+' po':'Aucun objet sélectionné';
  $('#bBook').textContent='Mon équipement ('+t.n+')';
  $('#tot').innerHTML=t.n?`Poids total : ${fkg(t.kg)} · Valeur totale : ${fmt(t.po)} po`:'';
}
function renderAll(){renderList();renderBook();autosave()}

function collect(){
  return {version:1,type:'equipement-dnd-5e',data:{
    titre:$('#titre').value,
    objets:DB.filter(s=>qty(s)).map(s=>({n:s.n,qte:qty(s)})),
    filtres:{q:st.q,cls:st.cls,sch:st.sch,lvl:st.lvl,only:st.only}}};
}
function syncInputs(){$('#fq').value=st.q;$('#fc').value=st.cls;fillSub();$('#fl').value=st.lvl;$('#fo').value=st.only}
function apply(o){
  const d=o&&o.data;
  if(!d||!Array.isArray(d.objets))throw new Error('format');
  st.sel.clear();let unknown=0;
  d.objets.forEach(x=>{
    const n=typeof x==='string'?x:x&&x.n,q=typeof x==='string'?1:Math.max(1,Math.min(999,parseInt(x&&x.qte)||1));
    const s=BYN.get(norm(String(n)));if(s)st.sel.set(s.n,q);else unknown++;
  });
  $('#titre').value=d.titre||'';
  const f=d.filtres||{};
  st.q=f.q||'';st.cls=f.cls||'';st.sch=f.sch||'';st.lvl=f.lvl||'';st.only=f.only?'1':'';
  syncInputs();renderAll();
  return unknown;
}
function blank(){st.sel.clear();st.q=st.cls=st.sch=st.lvl=st.only='';$('#titre').value='';syncInputs();renderAll()}
function show(obj){st.open.clear();st.tab=0;if(obj)apply(obj);else blank()}
function autosave(){Persos.save()}
function setQ(s,q){q=Math.max(0,Math.min(999,q));q?st.sel.set(s.n,q):st.sel.delete(s.n);renderAll()}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,s=DB[+b.dataset.i];
  if(a==='inc')setQ(s,qty(s)+1);
  else if(a==='dec')setQ(s,qty(s)-1);
  else if(a==='det'){st.open.has(s.n)?st.open.delete(s.n):st.open.add(s.n);renderList()}
  else if(a==='rm')setQ(s,0);
  else if(a==='tab'){st.tab=+b.dataset.l;renderBook()}
  else if(a==='mode')setMode(b.dataset.m);
});
function setMode(m){
  document.body.dataset.mode=m;
  document.querySelectorAll('[data-act=mode]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.m===m));
  if(m==='book'){
    const cnt=l=>DB.some(s=>s.t===TORDER[l]&&qty(s));
    if(!cnt(st.tab)){const f=TORDER.findIndex((t,l)=>cnt(l));if(f>=0){st.tab=f;renderBook()}}
  }
  scrollTo(0,0);
}
document.addEventListener('change',e=>{
  if(!e.target.classList.contains('qin'))return;
  const s=DB[+e.target.dataset.i],v=parseInt(e.target.value);
  setQ(s,isNaN(v)?0:v);
});
$('#fq').addEventListener('input',e=>{st.q=e.target.value;renderList();autosave()});
$('#fc').addEventListener('change',e=>{st.cls=e.target.value;fillSub();renderList();autosave()});
$('#fs').addEventListener('change',e=>{st.sch=e.target.value;renderList();autosave()});
$('#fl').addEventListener('input',e=>{st.lvl=e.target.value;renderList();autosave()});
$('#fo').addEventListener('change',e=>{st.only=e.target.value;renderList();autosave()});
$('#titre').addEventListener('input',autosave);
$('#bReset').onclick=()=>{st.q=st.cls=st.sch=st.lvl=st.only='';syncInputs();renderList();autosave()};

$('#bSave').onclick=()=>{
  const nom=($('#titre').value||Persos.current().nom||'equipement').trim().replace(/[^\p{L}\p{N}_-]+/gu,'_');
  const blob=new Blob([JSON.stringify(collect(),null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`equipement_${nom}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  msg('Équipement enregistré dans un fichier .json');
};
$('#bLoad').onclick=()=>$('#file').click();
$('#file').onchange=ev=>{
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const u=apply(JSON.parse(r.result));
    msg('Équipement chargé : '+st.sel.size+' type(s)'+(u?' ('+u+' introuvable'+(u>1?'s':'')+' ignoré'+(u>1?'s':'')+')':''));
  }catch(e){msg('Fichier invalide : choisis un .json créé par cette page')}};
  r.readAsText(f);ev.target.value='';
};
$('#bPrint').onclick=()=>{if(!st.sel.size){msg('Ajoute d’abord des objets à ton équipement');return}window.print()};
$('#bClear').onclick=()=>{
  if(!st.sel.size)return;
  if(!confirm('Retirer tout l’équipement de « '+Persos.current().nom+' » ? Pense à enregistrer un .json avant.'))return;
  st.sel.clear();renderAll();msg('Équipement vidé');
};

async function boot(){
  let data;
  try{
    const r=await fetch('equipement.json');
    if(!r.ok)throw new Error('HTTP '+r.status);
    data=await r.json();
  }catch(e){
    $('#cnt').textContent='';
    $('#list').innerHTML='<div class="empty-msg">Impossible de charger la liste (equipement.json). Vérifie ta connexion, puis recharge la page. En local, ouvre le site via un serveur web (pas en double-cliquant sur le fichier).</div>';
    return;
  }
  setup(data);
  Persos.init({part:'equipement',mount:$('#persos'),collect,apply:show,msg});
}
boot();
</script>
</body>
</html>
