<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Familiers et montures D&amp;D 5e</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261014c">
<link rel="stylesheet" href="assets/css/pages/familiers.css?v=20261022r">
<script src="assets/js/theme.js?v=20261022s"></script>
<script src="assets/js/vo.js?v=20261022s"></script>
</head>
<body data-mode="choose">
<div class="top">
 <div class="bar">
  <a class="home" href="./">← Accueil</a>
  <b>Familiers et montures</b>
  <span id="msg" role="status"></span>
  <button data-act="mode" data-m="choose" aria-pressed="true">Choisir les familiers</button>
  <button data-act="mode" data-m="book" aria-pressed="false" id="bBook">Mes familiers (0)</button>
  <button class="primary" id="bSave">Enregistrer (.json)</button>
  <button id="bLoad">Charger un .json</button>
  <button id="bPrint">Imprimer</button>
  <button id="bClear">Vider</button>
  <input type="file" id="file" accept="application/json,.json" hidden>
 </div>
 <div class="persos" id="persos"></div>
</div>

<!-- CHOISIR -->
<div id="choose" class="wrap">
 <section class="panel">
  <h2>Rechercher des familiers, compagnons et montures</h2>
  <div class="fgrid">
   <label><small>Nom</small><input id="fq" type="search" placeholder="Chat, diablotin, cheval de guerre…"></label>
   <label><small>Origine</small><select id="fc"></select></label>
   <label><small>Type de créature</small><select id="fs"></select></label>
   <label><small>Taille</small><select id="fl"></select></label>
  </div>
  <div class="fbar">
   <span class="cnt" id="cnt"></span>
      <label>Afficher&nbsp;<select id="fo"><option value="">tous les familiers</option><option value="1">ma sélection</option></select></label>
   <button class="b" id="bReset">Réinitialiser les filtres</button>
  </div>
 </section>
 <div class="list" id="list"><div class="empty-msg">Chargement des créatures…</div></div>
</div>

<!-- GRIMOIRE -->
<div id="book" class="wrap">
 <main class="sheet">
  <div class="hero">
   <input id="titre" placeholder="Nom du personnage" aria-label="Nom du personnage">
   <p id="sum"></p>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="levels"></div>
 </main>
</div>

<script src="assets/js/persos.js?v=20261022s"></script>
<script src="assets/js/page-utils.js?v=20261022r"></script>
<script src="assets/js/pages/familiers.js?v=20261022r"></script>
<script src="assets/js/recherche.js?v=20261022s"></script>
<script src="assets/js/sw-register.js?v=20261022s"></script>
</body>
</html>
