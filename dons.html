<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dons D&amp;D 5e</title>
<link rel="stylesheet" href="style.css?v=20261014c">
<style>
.wrap{max-width:1000px;margin:16px auto;padding:0 12px}

/* Filtres */
.panel{padding:10px 14px 12px}
.panel+.panel{margin-top:12px}
.panel h2{font:italic 700 16px var(--serif);color:#2a3170;margin:0 0 8px}
.fgrid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px 14px;align-items:end}
small{display:block;font-size:11px;color:var(--soft);margin-bottom:2px}
.fgrid input,.fgrid select,.pgrid input,.pgrid select{width:100%;border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:#fff}
.fbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px;font-size:12px;color:var(--soft)}
.fbar .cnt{margin-right:auto;font-weight:600;color:#2a3170}
.fbar label{display:flex;gap:5px;align-items:center;cursor:pointer}
.b{border:1.5px solid var(--c,#2a3170);background:#fff;color:var(--c,#2a3170);border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:600;font-size:12px}
.b:hover{background:color-mix(in srgb,var(--c,#2a3170) 10%,#fff)}
.b:disabled{opacity:.45;cursor:default;background:#fff}

/* Mon personnage */
.pgrid{display:grid;grid-template-columns:2fr .8fr repeat(6,.7fr);gap:8px 10px;align-items:end}
.pgrid input[type=number]{padding:6px 4px;text-align:center}
.chk{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:12.5px}
.chk label{display:flex;gap:5px;align-items:center;cursor:pointer}
.phint{font-size:11.5px;color:var(--soft);margin-top:6px}

/* Liste */
.list{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.item{background:#fff;border-radius:9px;box-shadow:0 1px 6px #0003;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-left:6px solid var(--c)}
.rmain{flex:1;min-width:0}
.rt{font:italic 700 15px var(--serif)}
.rs{font-size:11.5px;color:var(--soft)}
.racts{display:flex;gap:6px;flex:none}
.det{padding:2px 12px 12px;border-left:6px solid var(--c)}
.empty-msg{background:#fff;border-radius:9px;padding:18px;text-align:center;color:var(--soft)}
.pill{display:inline-block;font:600 10px system-ui;border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:middle;color:#fff;background:var(--c);font-style:normal}
.ok,.ko,.mb{display:inline-block;font:600 10.5px system-ui;border-radius:999px;padding:1px 8px;margin-top:3px}
.ok{background:#e3f4ea;color:#1f7a45}
.ko{background:#fbe7e4;color:#a8321f}
.mb{background:#fdf1d8;color:#8a5a00}
.has{background:#e8eaf6;color:#2a3170}
.desc{font-size:12.5px;line-height:1.45;margin-top:6px;padding-top:6px;border-top:1px dashed var(--c)}
.desc p{margin:4px 0}
.srcn{margin-top:8px;font-size:10.5px;color:var(--soft);font-style:italic}

@media screen and (max-width:760px){
 .fgrid{grid-template-columns:1fr 1fr}.fgrid>:first-child{grid-column:1/-1}
 .pgrid{grid-template-columns:repeat(6,1fr)}.pgrid>:nth-child(1){grid-column:1/5}.pgrid>:nth-child(2){grid-column:5/7}
 .row{flex-wrap:wrap}
 .racts{width:100%;justify-content:flex-end}
 .panel .fbar label.fok{grid-column:1/-1;display:flex;flex-direction:row;align-items:center}
}
</style>
<script src="theme.js?v=20261020a"></script>
</head>
<body>
<div class="top">
 <div class="bar">
  <a class="home" href="./">← Accueil</a>
  <b>Dons D&amp;D 5e</b>
  <button id="bNew" title="Crée ton propre don : il sera disponible pour tous tes personnages">+ Créer un don</button>
  <span id="msg" role="status"></span>
 </div>
</div>

<div class="wrap">
 <section class="panel">
  <h2>Mon personnage</h2>
  <div class="pgrid">
   <label><small>Personnage</small><select id="pp"></select></label>
   <label><small>Niveau</small><input id="pn" type="number" min="1" max="20" value="1"></label>
   <label><small>For</small><input id="a_for" type="number" min="1" max="30" value="10"></label>
   <label><small>Dex</small><input id="a_dex" type="number" min="1" max="30" value="10"></label>
   <label><small>Con</small><input id="a_con" type="number" min="1" max="30" value="10"></label>
   <label><small>Int</small><input id="a_int" type="number" min="1" max="30" value="10"></label>
   <label><small>Sag</small><input id="a_sag" type="number" min="1" max="30" value="10"></label>
   <label><small>Cha</small><input id="a_cha" type="number" min="1" max="30" value="10"></label>
  </div>
  <div class="chk">
   <label><input type="checkbox" id="c_cast"> Incantation ou Magie de pacte</label>
   <label><input type="checkbox" id="c_style"> Capacité Style de combat</label>
   <label><input type="checkbox" id="c_légères"> Armures légères</label>
   <label><input type="checkbox" id="c_intermédiaires"> Armures intermédiaires</label>
   <label><input type="checkbox" id="c_lourdes"> Armures lourdes</label>
   <label><input type="checkbox" id="c_boucliers"> Boucliers</label>
  </div>
  <div class="phint" id="phint"></div>
 </section>

 <section class="panel">
  <h2>Tous les dons (règles 2024)</h2>
  <div class="fgrid">
   <label><small>Nom ou effet</small><input id="fq" type="search" placeholder="Initiative, sort, bouclier, empoigner…"></label>
   <label><small>Catégorie</small><select id="fc"></select></label>
   <label><small>Prérequis</small><select id="fp"></select></label>
   <label><small>Caractéristique demandée</small><select id="fa"></select></label>
  </div>
  <div class="fbar">
   <span class="cnt" id="cnt"></span>
   <label class="fok"><input type="checkbox" id="fok"> Seulement ceux que je peux prendre</label>
   <button class="b" id="bAll">Tout déplier</button>
   <button class="b" id="bReset">Réinitialiser les filtres</button>
  </div>
 </section>
 <div class="list" id="list"><div class="empty-msg">Chargement des dons…</div></div>
</div>

<script src="persos.js?v=20261015a"></script>
<script src="custom.js?v=20261014c"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[’‘`´]/g,"'").trim();
const msg=t=>{$('#msg').textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>$('#msg').textContent='',5000)};
const rid=()=>Math.random().toString(36).slice(2,8);

const AB=[['for','Force'],['dex','Dextérité'],['con','Constitution'],['int','Intelligence'],['sag','Sagesse'],['cha','Charisme']];
const ABK=Object.fromEntries(AB.map(([k,n])=>[norm(n),k])),ABN=Object.fromEntries(AB);
const AR=['légères','intermédiaires','lourdes','boucliers'];
const CATC={'Origine':'#2e9e5b','Général':'#2a3170','Style de combat':'#c8402f','Faveur épique':'#7a4fc4'};
const MINE='Mes créations';
// Dons qu'on peut prendre plusieurs fois (règles 2024)
const REPEAT=new Set(['asi','adepte_elem','initie_magie','qualifie']);
// Armures maîtrisées par classe (règles 2024) et dons qui en donnent ; mêmes tables que la fiche
const PROF={'Artificier':['légères','intermédiaires','boucliers'],'Barbare':['légères','intermédiaires','boucliers'],'Barde':['légères'],'Chasseur de sang':['légères','intermédiaires'],'Clerc':['légères','intermédiaires','boucliers'],'Druide':['légères','boucliers'],'Guerrier':AR,'Occultiste':['légères'],'Paladin':AR,'Rôdeur':['légères','intermédiaires','boucliers'],'Roublard':['légères']};
const DONPROF={armure_legere:['légères','boucliers'],armure_inter:['intermédiaires','boucliers'],armure_lourde:['lourdes']};
// Capacité Style de combat : Guerrier niv. 1, Paladin et Rôdeur niv. 2
const STYLE={'Guerrier':1,'Paladin':2,'Rôdeur':2};
const PTYPES=[['none','Aucun prérequis'],['niv','Un niveau minimum'],['ab','Une valeur de caractéristique'],['cast','Incantation ou Magie de pacte'],['arm','Une maîtrise d’armure ou de bouclier'],['style','La capacité Style de combat'],['other','Autre (à vérifier)']];

let DB=[],BASE=[],CLS=null;
const st={q:'',c:'',p:'',a:'',ok:false,open:new Set()};
const me={niv:1,ab:{for:10,dex:10,con:10,int:10,sag:10,cha:10},cast:false,style:false,ar:new Set(),dons:[]};

// Prérequis en texte libre -> conditions vérifiables
function parsePre(pre){
 const t=norm(pre),r={niv:0,ab:null,cast:false,style:false,ar:[],other:false};
 if(!t)return r;
 const n=t.match(/niveau (\d+)/);if(n)r.niv=+n[1];
 const a=t.match(/((?:(?:force|dexterite|constitution|intelligence|sagesse|charisme)(?:\s*,\s*|\s+ou\s+)?)+)\s+(\d+)\s+ou\s+plus/);
 if(a)r.ab={keys:a[1].match(/force|dexterite|constitution|intelligence|sagesse|charisme/g).map(x=>ABK[x]),min:+a[2]};
 r.cast=/incantation|magie de pacte|capacite sorts/.test(t);
 r.style=/style de combat/.test(t);
 if(/armures? legeres/.test(t))r.ar.push('légères');
 if(/armures? intermediaires/.test(t))r.ar.push('intermédiaires');
 if(/armures? lourdes/.test(t))r.ar.push('lourdes');
 if(/bouclier/.test(t))r.ar.push('boucliers');
 r.other=!r.niv&&!r.ab&&!r.cast&&!r.style&&!r.ar.length;
 return r;
}
function build(){
 const mine=(Persos.custom().dons||[]).filter(x=>x&&x.id&&x.nom);
 DB=BASE.map(x=>({...x,mine:false})).concat(mine.map(x=>({...x,mine:true}))).map(x=>{
  const P=parsePre(x.pre),types=[];
  if(!norm(x.pre))types.push('none');
  if(P.niv)types.push('niv');if(P.ab)types.push('ab');if(P.cast)types.push('cast');
  if(P.ar.length)types.push('arm');if(P.style)types.push('style');if(P.other&&norm(x.pre))types.push('other');
  return Object.assign(x,{P,types,c:x.mine?'#d8791a':CATC[x.cat]||'#2a3170',idx:norm(x.nom+' '+x.cat+' '+x.pre+' '+x.desc)});
 });
 const cats=[];BASE.forEach(x=>{if(!cats.includes(x.cat))cats.push(x.cat)});
 const keep=$('#fc').value;
 $('#fc').innerHTML='<option value="">Toutes</option>'+cats.concat(mine.length?[MINE]:[]).map(c=>`<option>${esc(c)}</option>`).join('');
 $('#fc').value=cats.includes(keep)||keep===MINE&&mine.length?keep:'';st.c=$('#fc').value;
}
// Conditions non remplies par le personnage ; null si le don a un prérequis qu'on ne sait pas vérifier
function missing(x){
 const P=x.P,m=[];
 if(P.other)return null;
 if(P.niv&&me.niv<P.niv)m.push('niveau '+P.niv);
 if(P.ab&&!P.ab.keys.some(k=>me.ab[k]>=P.ab.min))m.push(P.ab.keys.map(k=>ABN[k]).join(' ou ')+' '+P.ab.min);
 if(P.cast&&!me.cast)m.push('Incantation ou Magie de pacte');
 if(P.style&&!me.style)m.push('capacité Style de combat');
 P.ar.filter(a=>!me.ar.has(a)).forEach(a=>m.push(a==='boucliers'?'maîtrise des boucliers':'maîtrise des armures '+a));
 return m;
}
const taken=x=>me.dons.filter(id=>id===x.id).length;

function descHTML(x){
 return x.desc.split('\n').filter(l=>l.trim()).map(l=>{
  const i=l.indexOf(' : ');
  return i>0&&i<60?`<p><b><i>${esc(l.slice(0,i))}.</i></b> ${esc(l.slice(i+3))}</p>`:`<p>${esc(l)}</p>`;
 }).join('');
}
function filtered(){
 const q=norm(st.q);
 return DB.filter(x=>(!q||x.idx.includes(q))
  &&(!st.c||(st.c===MINE?x.mine:x.cat===st.c&&!x.mine))
  &&(!st.p||x.types.includes(st.p))
  &&(!st.a||(st.a==='-'?!x.P.ab:x.P.ab&&x.P.ab.keys.includes(st.a)))
  &&(!st.ok||(missing(x)||[1]).length===0));
}
function render(){
 const r=filtered();
 $('#cnt').textContent=r.length+' don'+(r.length>1?'s':'')+' affiché'+(r.length>1?'s':'')+' sur '+DB.length;
 $('#bAll').textContent=r.length&&r.every(x=>st.open.has(x.id))?'Tout replier':'Tout déplier';
 const who=esc(curName());
 $('#list').innerHTML=r.length?r.map(x=>{
  const op=st.open.has(x.id),m=missing(x),n=taken(x),rep=REPEAT.has(x.id);
  const stat=m===null?`<span class="mb" title="${esc(x.pre)}">Prérequis à vérifier : ${esc(x.pre)}</span>`
   :m.length?`<span class="ko">Il manque : ${esc(m.join(', '))}</span>`
   :`<span class="ok">${x.pre?'Prérequis remplis':'Sans prérequis'}</span>`;
  const sub=[x.mine?'Création personnelle · '+x.cat:x.cat,x.pre?'Prérequis : '+x.pre:'Aucun prérequis'].join(' · ');
  const add=n&&!rep?`<button class="b" disabled title="Déjà sur la fiche de ${who}">Sur la fiche</button>`
   :`<button class="b" data-add="${esc(x.id)}" title="Ajoute ce don à la fiche de ${who}">Ajouter${n?' encore':''}</button>`;
  return `<div class="item" id="${esc(x.id)}" style="--c:${x.c}"><div class="row"><div class="rmain"><div class="rt">${esc(x.nom)}${x.mine?'<span class="pill">Création</span>':''}${rep?'<span class="pill" style="background:#5f6580">Répétable</span>':''}</div><div class="rs">${esc(sub)}</div>${stat}${n?` <span class="mb has">Sur la fiche${n>1?' ×'+n:''}</span>`:''}</div>
  <div class="racts">${x.mine?`<button class="b" data-edit="${esc(x.id)}">Modifier</button>`:''}${add}<button class="b" data-n="${esc(x.id)}" aria-expanded="${op}">${op?'Masquer':'Détails'}</button></div></div>${op?`<div class="det"><div class="desc">${descHTML(x)}</div><div class="srcn">${x.mine?'Création personnelle':'Source : '+esc(x.src||'Manuel des joueurs 2024')+(x.r_?' · reconstitué à partir d’un résumé : à vérifier dans le livre':' · reformulé : le livre fait foi')}${x.choix&&x.choix.length?' · les choix du don se font dans la fiche':''}</div></div>`:''}</div>`;
 }).join(''):'<div class="empty-msg">Aucun don ne correspond à ces filtres.</div>';
}

/* ---------- Personnage ---------- */
const curName=()=>{const p=Persos.list().find(p=>p.actif);return p?p.nom:''};
function fillChars(){
 $('#pp').innerHTML=Persos.list().map(p=>`<option value="${esc(p.id)}"${p.actif?' selected':''}>${esc(p.nom)}</option>`).join('');
}
function findClass(d){
 if(!CLS)return null;
 const v=norm(d.classe||d.clsel);if(!v)return null;
 for(const [n,c] of Object.entries(CLS))if(norm(n)===v||(c.alias||[]).some(a=>norm(a)===v))return [n,c];
 return null;
}
// Reprend niveau, caractéristiques finales, incantation et maîtrises depuis la fiche du personnage actif
function loadChar(){
 const f=Persos.part('fiche'),d=f&&f.data||{},D=d.derive;
 const ex=d.extras||{};
 me.dons=(Array.isArray(ex.dons)?ex.dons:[]).filter(g=>g&&g.id).map(g=>g.id);
 const cl=findClass(d);
 if(D&&D.tot){
  me.niv=D.niv;AB.forEach(([k])=>me.ab[k]=D.tot[k]||10);me.cast=!!D.cast;me.ar=new Set(D.ar||[]);
 }else{   // fiche jamais rouverte depuis l'ajout de cette page : valeurs de base
  me.niv=Math.min(20,Math.max(1,parseInt(d.niveau)||1));
  AB.forEach(([k])=>me.ab[k]=parseInt(d['ab_'+k])||10);
  me.cast=!!(cl&&(cl[1].lanceur||cl[1].sous_classe&&d.sclance));
  me.ar=new Set(cl&&PROF[cl[0]]||[]);me.dons.forEach(id=>(DONPROF[id]||[]).forEach(a=>me.ar.add(a)));
 }
 const cn=D&&D.cl||cl&&cl[0]||'';
 me.style=!!(STYLE[cn]&&me.niv>=STYLE[cn]);
 $('#pn').value=me.niv;
 AB.forEach(([k])=>$('#a_'+k).value=me.ab[k]);
 $('#c_cast').checked=me.cast;$('#c_style').checked=me.style;
 AR.forEach(a=>$('#c_'+a).checked=me.ar.has(a));
 $('#phint').textContent=!f?'Ce personnage n’a pas encore de fiche : indique son niveau et ses caractéristiques ici, ou remplis sa fiche.'
  :(D?'Valeurs reprises de la fiche (caractéristiques finales, bonus compris)':'Valeurs de base reprises de la fiche (ouvre la fiche une fois pour inclure les bonus d’espèce, d’historique et de dons)')
   +(cn?' · '+cn+' niveau '+me.niv:'')+'. Tu peux les modifier ici pour tester, sans changer la fiche.';
}
function readInputs(){
 me.niv=Math.min(20,Math.max(1,parseInt($('#pn').value)||1));
 AB.forEach(([k])=>me.ab[k]=parseInt($('#a_'+k).value)||10);
 me.cast=$('#c_cast').checked;me.style=$('#c_style').checked;
 me.ar=new Set(AR.filter(a=>$('#c_'+a).checked));
 render();
}
document.querySelector('.pgrid').addEventListener('input',e=>{if(e.target.id!=='pp')readInputs()});
document.querySelector('.chk').addEventListener('change',readInputs);
$('#pp').addEventListener('change',e=>{Persos.activate(e.target.value);loadChar();render()});
// Fiche modifiée dans un autre onglet : on suit
addEventListener('storage',e=>{
 if(e.key==='dnd_persos_v1'){fillChars();loadChar();render()}
 else if(e.key==='dnd_perso_custom_v1'&&BASE.length){build();render()}
});

/* ---------- Actions ---------- */
function addDon(x){
 Persos.edit(q=>{
  if(!q.fiche||!q.fiche.data)q.fiche={version:5,type:'fiche-dnd-5e',data:{nom:q.nom}};
  const d=q.fiche.data;
  if(!d.extras||typeof d.extras!=='object')d.extras={};
  if(!Array.isArray(d.extras.dons))d.extras.dons=[];
  d.extras.dons.push({u:rid(),id:x.id,ch:{}});
 });
 me.dons.push(x.id);render();
 msg('« '+x.nom+' » ajouté à la fiche de '+curName()+(x.choix&&x.choix.length?' : fais ses choix dans la fiche':''));
}
function editDon(it){
 const cats=[];BASE.forEach(x=>{if(!cats.includes(x.cat))cats.push(x.cat)});
 Custom.edit({kind:'dons',item:it,cats,
  taken:n=>DB.some(x=>x.id!==(it&&it.id)&&norm(x.nom)===norm(n)),
  done:(x,old)=>{build();render();msg(x?(old?'Don modifié':'Don « '+x.nom+' » créé'):'Don supprimé')}});
}
$('#bNew').onclick=()=>editDon(null);
$('#list').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.n){const n=b.dataset.n;st.open.has(n)?st.open.delete(n):st.open.add(n);render()}
 else if(b.dataset.add){const x=DB.find(y=>y.id===b.dataset.add);if(x)addDon(x)}
 else if(b.dataset.edit){const x=(Persos.custom().dons||[]).find(y=>y.id===b.dataset.edit);if(x)editDon(x)}
});

/* ---------- Filtres ---------- */
$('#fp').innerHTML='<option value="">Tous</option>'+PTYPES.map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join('');
$('#fa').innerHTML='<option value="">Toutes</option><option value="-">Aucune</option>'+AB.map(([k,n])=>`<option value="${k}">${n}</option>`).join('');
[['#fq','q','input'],['#fc','c','change'],['#fp','p','change'],['#fa','a','change']].forEach(([s,k,ev])=>$(s).addEventListener(ev,e=>{st[k]=e.target.value;render()}));
$('#fok').addEventListener('change',e=>{st.ok=e.target.checked;render()});
$('#bReset').onclick=()=>{Object.assign(st,{q:'',c:'',p:'',a:'',ok:false});['#fq','#fc','#fp','#fa'].forEach(s=>$(s).value='');$('#fok').checked=false;render()};
$('#bAll').onclick=()=>{const r=filtered(),all=r.length&&r.every(x=>st.open.has(x.id));r.forEach(x=>all?st.open.delete(x.id):st.open.add(x.id));render()};

fillChars();
Promise.all([fetch('dons.json').then(r=>{if(!r.ok)throw new Error('dons');return r.json()}),
             fetch('classes.json').then(r=>r.ok?r.json():null).catch(()=>null)])
 .then(([D,C])=>{
  BASE=D;CLS=C&&C.classes||null;
  build();loadChar();
  // Lien direct : dons.html#vigilant ouvre le don
  const h=decodeURIComponent(location.hash.slice(1));
  if(h&&DB.some(x=>x.id===h))st.open.add(h);
  render();
  if(h){const el=document.getElementById(h);if(el)el.scrollIntoView()}
 })
 .catch(()=>{$('#list').innerHTML='<div class="empty-msg">Impossible de charger les dons (ouvre le site via un serveur web).</div>'});
</script>
<script src="recherche.js?v=20261020a"></script>
<script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}))</script>
</body>
</html>
