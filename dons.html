<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dons D&amp;D 5e</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261014c">
<link rel="stylesheet" href="assets/css/pages/dons.css?v=20261022r">
<script src="assets/js/theme.js?v=20261022s"></script>
<script src="assets/js/vo.js?v=20261022s"></script>
</head>
<body>
<div class="top">
 <div class="bar">
  <a class="home" href="./">← Accueil</a>
  <b>Dons D&amp;D 5e</b>
  <button id="bNew" title="Crée ton propre don : il sera disponible pour tous tes personnages">+ Créer un don</button>
  <span id="msg" role="status"></span>
 </div>
</div>

<div class="wrap">
 <section class="panel">
  <h2>Mon personnage</h2>
  <div class="pgrid">
   <label><small>Personnage</small><select id="pp"></select></label>
   <label><small>Niveau</small><input id="pn" type="number" min="1" max="20" value="1"></label>
   <label><small>For</small><input id="a_for" type="number" min="1" max="30" value="10"></label>
   <label><small>Dex</small><input id="a_dex" type="number" min="1" max="30" value="10"></label>
   <label><small>Con</small><input id="a_con" type="number" min="1" max="30" value="10"></label>
   <label><small>Int</small><input id="a_int" type="number" min="1" max="30" value="10"></label>
   <label><small>Sag</small><input id="a_sag" type="number" min="1" max="30" value="10"></label>
   <label><small>Cha</small><input id="a_cha" type="number" min="1" max="30" value="10"></label>
  </div>
  <div class="chk">
   <label><input type="checkbox" id="c_cast"> Incantation ou Magie de pacte</label>
   <label><input type="checkbox" id="c_style"> Capacité Style de combat</label>
   <label><input type="checkbox" id="c_occ"> Occultiste</label>
   <label><input type="checkbox" id="c_légères"> Armures légères</label>
   <label><input type="checkbox" id="c_intermédiaires"> Armures intermédiaires</label>
   <label><input type="checkbox" id="c_lourdes"> Armures lourdes</label>
   <label><input type="checkbox" id="c_boucliers"> Boucliers</label>
  </div>
  <div class="phint" id="phint"></div>
 </section>

 <section class="panel">
  <h2>Tous les dons et manifestations occultes (règles 2024, plus les manifestations 2014 disparues)</h2>
  <div class="fgrid">
   <label><small>Nom ou effet</small><input id="fq" type="search" placeholder="Initiative, sort, bouclier, empoigner…"></label>
   <label><small>Catégorie</small><select id="fc"></select></label>
   <label><small>Prérequis</small><select id="fp"></select></label>
   <label><small>Caractéristique demandée</small><select id="fa"></select></label>
  </div>
  <div class="fbar">
   <span class="cnt" id="cnt"></span>
   <label class="fok"><input type="checkbox" id="fok"> Seulement ceux que je peux prendre</label>
   <button class="b" id="bAll">Tout déplier</button>
   <button class="b" id="bReset">Réinitialiser les filtres</button>
  </div>
 </section>
 <div class="list" id="list"><div class="empty-msg">Chargement des dons…</div></div>
</div>

<script src="assets/js/persos.js?v=20261022s"></script>
<script src="assets/js/custom.js?v=20261022s"></script>
<script src="assets/js/pages/dons.js?v=20261022r"></script>
<script src="assets/js/recherche.js?v=20261022s"></script>
<script src="assets/js/sw-register.js?v=20261022s"></script>
</body>
</html>
