<!DOCTYPE html>

<style>
.wrap{max-width:900px;margin:16px auto;padding:0 12px 40px}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.steps button{flex:1 1 auto;padding:6px 10px;border:1px solid #ffffff55;border-radius:999px;background:transparent;color:#fff;font-size:13px;cursor:pointer;white-space:nowrap}
.steps button[aria-current=step]{background:var(--gold);border-color:var(--gold);color:#201700;font-weight:600}
.steps button.ok:not([aria-current=step]){background:#ffffff22}
.steps button:disabled{opacity:.45;cursor:default}
.sheet{background:#fff;border-radius:10px;border-top:4px solid var(--gold);box-shadow:0 4px 24px #0005;padding:16px}
.sheet h2{margin:0 0 4px;font:italic 700 22px var(--serif);color:#2a3170}
.lead{margin:0 0 12px;color:var(--soft);font-size:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0 14px}
.opt{--c:#2a3170;text-align:left;padding:8px 10px;border:2px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;line-height:1.3}
.opt b{display:block;font:italic 700 16px var(--serif);color:var(--c)}
.opt small{color:var(--soft)}
.opt[aria-pressed=true]{border-color:var(--gold);background:#fff7df;box-shadow:0 0 0 2px var(--gold) inset}
.box{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:10px 0;background:#f8f9fd}
.box h3{margin:0 0 6px;font:italic 700 17px var(--serif);color:#2a3170}
.box ul{margin:4px 0;padding-left:18px}
.box li{margin:2px 0}
.box p{margin:4px 0}
.chs{display:flex;flex-wrap:wrap;gap:8px 12px;margin:8px 0}
.chs label{display:flex;flex-direction:column;gap:2px;min-width:180px;flex:1 1 180px}
.chs small,.lbl{font-size:12px;color:var(--soft)}
select,input[type=text],input[type=number]{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;max-width:100%}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.seg button{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer}
.seg button[aria-pressed=true]{background:#2a3170;border-color:#2a3170;color:#fff}
.abg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ab{border:2px solid var(--c);border-radius:9px;padding:6px 8px;text-align:center;background:#fff}
.ab .n{font-weight:600;color:var(--c)}
.ab .ctl{display:flex;justify-content:center;align-items:center;gap:6px;margin:4px 0}
.ab .ctl button{width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:16px}
.ab .ctl b{font-size:20px;min-width:28px}
.ab .fin{font-size:12px;color:var(--soft)}
.ab .fin b{font-size:15px;color:var(--ink)}
.pts{font-weight:600;margin:4px 0 8px}
.pts.bad{color:#c8402f}
.sk{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 10px;margin:6px 0}
.sk label{display:flex;gap:6px;align-items:center;padding:3px 4px;border-radius:5px}
.sk label.got{color:var(--soft)}
.sk label.got span::after{content:" (déjà acquise)";font-size:11px}
.warn{color:#b0451a;font-size:13px;margin:6px 0}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.nav button{padding:9px 16px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font-weight:600}
.nav .primary{background:var(--gold);border-color:var(--gold);color:#201700}
.nav button:disabled{opacity:.4;cursor:default}
.rec{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0}
.rec dt{font-weight:600;color:#2a3170}
.rec dd{margin:0}
.lang{display:flex;flex-wrap:wrap;gap:4px 12px}
.lang label{display:flex;gap:5px;align-items:center}
.done{text-align:center}
.done .links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.done a{padding:9px 16px;border-radius:7px;background:#2a3170;color:#fff;text-decoration:none;font-weight:600}
.done a.primary{background:var(--gold);color:#201700}
.dice{font-size:12px;color:var(--soft)}
h3.sub{margin:18px 0 2px;font:italic 700 18px var(--serif);color:#2a3170;border-top:1px solid var(--line);padding-top:12px}
.opts+.lbl{margin-top:-4px}
@media (max-width:520px){.opts{grid-template-columns:1fr 1fr}.rec{grid-template-columns:1fr}.rec dd{margin-bottom:6px}}
</style>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const sg=n=>(n>=0?'+':'')+n;
const fm=n=>String(n).replace('.',',');
const md=v=>Math.floor((v-10)/2);
const msg=t=>{$('#msg').textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>$('#msg').textContent='',3500)};

const AB=[['for','Force','#c8402f'],['dex','Dextérité','#2e9e5b'],['con','Constitution','#d8791a'],['int','Intelligence','#2f6fd0'],['sag','Sagesse','#7a4fc4'],['cha','Charisme','#d6458e']];
const ABN=Object.fromEntries(AB.map(a=>[a[0],a[1]]));
const ABK=AB.map(a=>a[0]);
const SK=[['Acrobaties','dex'],['Arcanes','int'],['Athlétisme','for'],['Discrétion','dex'],['Dressage','sag'],['Escamotage','dex'],['Histoire','int'],['Intimidation','cha'],['Intuition','sag'],['Investigation','int'],['Médecine','sag'],['Nature','int'],['Perception','sag'],['Persuasion','cha'],['Religion','int'],['Représentation','cha'],['Supercherie','cha'],['Survie','sag']];
const SKN=SK.map(s=>s[0]);
const ALL='*';

/* Classes (règles 2024) : dé de vie, caractéristique principale, jets de sauvegarde, compétences au choix,
   répartition conseillée du tableau standard (For, Dex, Con, Int, Sag, Cha) et équipement de départ. */
const CL={
 'Barbare':{d:12,p:['for'],sv:['for','con'],n:2,sk:['Athlétisme','Dressage','Intimidation','Nature','Perception','Survie'],std:[15,13,14,10,12,8],
  txt:'Guerrier sauvage porté par sa Rage, très résistant au corps à corps.',

 'Barde':{d:8,p:['cha'],sv:['dex','cha'],n:3,sk:ALL,std:[8,14,12,13,10,15],
  txt:'Artiste dont la musique et les mots tissent la magie ; inspire ses alliés.',
  eq:[['Armure de cuir, 2 dagues, un instrument de musique, paquetage d’artiste et 19 po',[['Armure de cuir',1],['Dague',2],['@instrument',1],['Paquetage d’artiste',1]],19],['90 po',[],90]]},
 'Clerc':{d:8,p:['sag'],sv:['sag','cha'],n:2,sk:['Histoire','Intuition','Médecine','Persuasion','Religion'],std:[14,8,13,10,15,12],
  txt:'Prêtre qui canalise le pouvoir de sa divinité : soins, protection et colère divine.',
  eq:[['Chemise de mailles, bouclier, masse d’armes, symbole sacré, paquetage de prêtre et 7 po',[['Chemise de mailles',1],['Bouclier',1],['Masse d’armes',1],['Symbole sacré (amulette)',1],['Paquetage de prêtre',1]],7],['110 po',[],110]]},
 'Druide':{d:8,p:['sag'],sv:['int','sag'],n:2,sk:['Arcanes','Dressage','Intuition','Médecine','Nature','Perception','Religion','Survie'],std:[8,12,14,13,15,10],
  txt:'Gardien de la nature qui en tire sa magie et peut prendre une forme animale.',
  eq:[['Armure de cuir, bouclier, serpe, focaliseur druidique, paquetage d’explorateur, matériel d’herboriste et 9 po',[['Armure de cuir',1],['Bouclier',1],['Serpe',1],['Focalisation druidique (houx)',1],['Paquetage d’explorateur',1],['Matériel d’herboriste',1]],9],['50 po',[],50]]},
 'Ensorceleur':{d:6,p:['cha'],sv:['con','cha'],n:2,sk:['Arcanes','Intimidation','Intuition','Persuasion','Religion','Supercherie'],std:[10,13,14,8,12,15],
  txt:'La magie coule dans ses veines ; il la façonne grâce à la métamagie.',
  eq:[['Lance, 2 dagues, focaliseur arcanique (cristal), paquetage d’exploration souterraine et 28 po',[['Lance',1],['Dague',2],['Focalisation arcanique (cristal)',1],['Paquetage d’exploration souterraine',1]],28],['50 po',[],50]]},
 'Guerrier':{d:10,p:['for','dex'],sv:['for','con'],n:2,sk:['Acrobaties','Athlétisme','Dressage','Histoire','Intimidation','Intuition','Perception','Persuasion','Survie'],std:[15,14,13,8,10,12],
  txt:'Maître des armes et des armures, polyvalent et solide.',
  eq:[['Cotte de mailles, épée à deux mains, fléau d’armes, 8 javelines, paquetage d’exploration souterraine et 4 po',[['Cotte de mailles',1],['Épée à deux mains',1],['Fléau d’armes',1],['Javeline',8],['Paquetage d’exploration souterraine',1]],4],
      ['Armure de cuir clouté, cimeterre, épée courte, arc long, 20 flèches, carquois, paquetage d’exploration souterraine et 11 po',[['Armure de cuir clouté',1],['Cimeterre',1],['Épée courte',1],['Arc long',1],['Flèches (20)',1],['Carquois',1],['Paquetage d’exploration souterraine',1]],11],['155 po',[],155]]},
 'Magicien':{d:6,p:['int'],sv:['int','sag'],n:2,sk:['Arcanes','Histoire','Intuition','Investigation','Médecine','Nature','Religion'],std:[8,12,13,15,14,10],
  txt:'Érudit de la magie qui apprend ses sorts dans un grimoire.',
  eq:[['2 dagues, focaliseur arcanique (bâton), robe, livre de sorts, paquetage d’érudit et 5 po',[['Dague',2],['Focalisation arcanique (bâton)',1],['Robe',1],['Livre de sorts',1],['Paquetage d’érudit',1]],5],['55 po',[],55]]},
 'Moine':{d:8,p:['dex','sag'],sv:['for','dex'],n:2,sk:['Acrobaties','Athlétisme','Discrétion','Histoire','Intuition','Religion'],std:[12,15,13,10,14,8],
  txt:'Combattant à mains nues, rapide et discipliné, qui puise dans sa Concentration.',
  eq:[['Lance, 5 dagues, outils d’artisan ou instrument choisi, paquetage d’explorateur et 11 po',[['Lance',1],['Dague',5],['Paquetage d’explorateur',1]],11],['50 po',[],50]]},
 'Occultiste':{d:8,p:['cha'],sv:['sag','cha'],n:2,sk:['Arcanes','Histoire','Intimidation','Investigation','Nature','Religion','Supercherie'],std:[8,14,13,12,10,15],
  txt:'Lié par un pacte à une puissance de l’au-delà qui lui accorde ses dons.',
  eq:[['Armure de cuir, serpe, 2 dagues, focaliseur arcanique (orbe), livre de savoir occulte, paquetage d’érudit et 15 po',[['Armure de cuir',1],['Serpe',1],['Dague',2],['Focalisation arcanique (orbe)',1],['Livre',1],['Paquetage d’érudit',1]],15],['100 po',[],100]]},
 'Paladin':{d:10,p:['for','cha'],sv:['sag','cha'],n:2,sk:['Athlétisme','Intimidation','Intuition','Médecine','Persuasion','Religion'],std:[15,10,13,8,12,14],
  txt:'Guerrier sacré lié par un serment ; frappe divine et imposition des mains.',
  eq:[['Cotte de mailles, bouclier, épée longue, 6 javelines, symbole sacré, paquetage de prêtre et 9 po',[['Cotte de mailles',1],['Bouclier',1],['Épée longue',1],['Javeline',6],['Symbole sacré (emblème)',1],['Paquetage de prêtre',1]],9],['150 po',[],150]]},
 'Rôdeur':{d:10,p:['dex','sag'],sv:['for','dex'],n:3,sk:['Athlétisme','Discrétion','Dressage','Intuition','Investigation','Nature','Perception','Survie'],std:[12,15,13,8,14,10],
  txt:'Chasseur et pisteur des terres sauvages, à l’arc comme à la lame.',
  eq:[['Armure de cuir clouté, cimeterre, épée courte, arc long, 20 flèches, carquois, focaliseur druidique, paquetage d’explorateur et 7 po',[['Armure de cuir clouté',1],['Cimeterre',1],['Épée courte',1],['Arc long',1],['Flèches (20)',1],['Carquois',1],['Focalisation druidique (houx)',1],['Paquetage d’explorateur',1]],7],['150 po',[],150]]},
 'Roublard':{d:8,p:['dex'],sv:['dex','int'],n:4,exp:2,sk:['Acrobaties','Athlétisme','Discrétion','Escamotage','Intimidation','Intuition','Investigation','Perception','Persuasion','Représentation','Supercherie'],std:[12,15,13,14,10,8],
  txt:'Spécialiste de la discrétion et des attaques sournoises, aux multiples talents.',
  eq:[['Armure de cuir, 2 dagues, épée courte, arc court, 20 flèches, carquois, outils de voleur, paquetage de cambrioleur et 8 po',[['Armure de cuir',1],['Dague',2],['Épée courte',1],['Arc court',1],['Flèches (20)',1],['Carquois',1],['Outils de voleur',1],['Paquetage de cambrioleur',1]],8],['100 po',[],100]]},
 'Artificier':{d:8,p:['int'],sv:['con','int'],n:2,sk:['Arcanes','Escamotage','Histoire','Investigation','Médecine','Nature','Perception'],std:[8,14,13,15,12,10],
  txt:'Inventeur qui insuffle la magie dans des objets et des infusions.',
  eq:[['Armure de cuir clouté, dague, outils de voleur, outils de bricoleur, paquetage d’exploration souterraine et 16 po',[['Armure de cuir clouté',1],['Dague',1],['Outils de voleur',1],['Outils de bricoleur',1],['Paquetage d’exploration souterraine',1]],16],['150 po',[],150]]},
 'Chasseur de sang':{d:10,p:['for','dex','int'],sv:['dex','int'],n:3,sk:['Acrobaties','Arcanes','Athlétisme','Histoire','Intuition','Investigation','Religion','Survie'],std:[15,12,14,13,10,8],
  txt:'Traqueur de monstres qui sacrifie sa vitalité pour des rites de sang (contenu non officiel, Critical Role).',
  eq:[['Armure de cuir clouté, épée longue, arbalète légère, 20 carreaux, étui à carreaux, outils d’alchimiste, paquetage d’explorateur et 10 po',[['Armure de cuir clouté',1],['Épée longue',1],['Arbalète légère',1],['Carreaux (20)',1],['Étui à carreaux',1],['Outils d’alchimiste',1],['Paquetage d’explorateur',1]],10],['100 po',[],100]]},
};
const INSTR=['Luth','Lyre','Flûte','Flûte de Pan','Cor','Tambour','Dulcimer','Cornemuse','Chalumeau','Viole'];
const LANGC=['Commun des signes','Draconique','Elfique','Géant','Gnome','Gobelin','Halfelin','Nain','Orc'];
const ALIGN=['Loyal Bon','Neutre Bon','Chaotique Bon','Loyal Neutre','Neutre','Chaotique Neutre','Loyal Mauvais','Neutre Mauvais','Chaotique Mauvais'];
const STD=[15,14,13,12,10,8];
const COST={8:0,9:1,10:2,11:3,12:4,13:5,14:7,15:9};

let ESP=null,BG=null,DON=null,SCD=null,CLD=null;
const DRAFT='dnd_creation_brouillon';
const blank=()=>({step:0,max:0,niv:1,sc:'',asi:{},cl:'',bg:'',bgch:{mode:'+2 / +1'},feat:{},esp:'',lig:'',spch:{},hfeat:'',hfeatch:{},
  meth:'std',pool:STD.slice(),as:{for:0,dex:1,con:2,int:3,sag:4,cha:5},pb:{for:8,dex:8,con:8,int:8,sag:8,cha:8},rolls:null,
  sk:[],ex:[],eq:0,bgeq:'po',instr:'Luth',langs:[],nom:'',align:'',done:false});
let S=blank();
try{const d=JSON.parse(localStorage.getItem(DRAFT));if(d&&typeof d==='object')S=Object.assign(blank(),d,{done:false})}catch(e){}
const keep=()=>{try{localStorage.setItem(DRAFT,JSON.stringify(S))}catch(e){}};

const STEPS=[['Classe',stClass],['Historique',stBg],['Espèce',stEsp],['Caractéristiques',stAb],['Compétences',stSk],['Équipement et langues',stEq],['Résumé',stEnd]];

/* ---------- Calculs ---------- */
const C=()=>CL[S.cl];
const N=()=>Math.min(20,Math.max(1,parseInt(S.niv)||1));
const subs=()=>SCD&&SCD[S.cl]?Object.keys(SCD[S.cl]):[];
// Niveaux qui donnent un don (Amélioration de caractéristique ou autre don général ; faveur épique au niveau 19)
function asiLv(){
  const l=[4,8,12,16,19];
  if(S.cl==='Guerrier')l.push(6,14);
  if(S.cl==='Roublard')l.push(10);
  return l.filter(n=>n<=N()).sort((a,b)=>a-b);
}
// Don choisi à un niveau donné, et ses choix (par défaut : +2 dans la caractéristique principale)
function asiAt(lv){
  const id=S.asi[lv]||'asi',d=don(id);
  const p=(C()||{p:['for']}).p[0];
  return [d,S['ac'+lv]||(id==='asi'?{a:p,b:p}:{})];
}
const B=()=>BG&&BG[S.bg];
const E=()=>ESP&&ESP[S.esp];
const lig=()=>{const e=E();return e&&e.lignage?e.lignage.opts.find(o=>o.v===S.lig):null};
const don=id=>(DON||[]).find(x=>x.id===id);
function base(){
  const o={};
  if(S.meth==='pb')ABK.forEach(k=>o[k]=S.pb[k]);
  else{const pool=S.meth==='roll'&&S.rolls?S.rolls:STD;ABK.forEach(k=>o[k]=pool[S.as[k]])}
  return o;
}
// Bonus de l'historique (+2/+1 ou +1/+1/+1) et effets « carac » de l'espèce
function bonus(){
  const o={},b=B(),add=(k,n)=>{if(k)o[k]=(o[k]||0)+n};
  if(b){
    if(S.bgch.mode==='+1 / +1 / +1')b.carac.forEach(k=>add(k,1));
    else{add(S.bgch.a2,2);if(S.bgch.a1!==S.bgch.a2)add(S.bgch.a1,1)}
  }
  const e=E();
  if(e)[...e.fx,...((lig()||{}).fx||[])].forEach(f=>{if(f.t==='carac')add(f.v||S.spch[f.c],f.n||1)});
  feats().forEach(([d,ch])=>(d.fx||[]).forEach(f=>{if(f.t==='carac')add(f.v||ch[f.c],f.n||1)}));
  return o;
}
function finals(){const b=base(),x=bonus(),o={};ABK.forEach(k=>o[k]=Math.min(20,b[k]+(x[k]||0)));return o}
// Compétences déjà acquises par l'historique, l'espèce et les dons (avec leur origine)
function granted(){
  const g={},b=B(),e=E();
  const put=(n,src)=>{if(n&&!g[n])g[n]=src};
  if(b)b.comp.forEach(n=>put(n,'historique'));
  if(e)[...e.fx,...((lig()||{}).fx||[])].forEach(f=>{if(f.t==='comp')put(f.v||S.spch[f.c],'espèce')});
  feats().forEach(([d,ch])=>(d.fx||[]).forEach(f=>{if(f.t==='comp')put(f.v||ch[f.c],d.nom)}));
  return g;
}
// Dons acquis : don d'origine de l'historique, et celui de l'humain (Polyvalent)
function feats(){
  const r=[],b=B();
  if(b&&don(b.don))r.push([don(b.don),Object.assign({},b.don_ch||{},S.feat)]);
  if(S.esp==='Humain'&&don(S.hfeat))r.push([don(S.hfeat),S.hfeatch]);
  asiLv().forEach(lv=>{const a=asiAt(lv);if(a[0])r.push(a)});
  return r;
}
function hp(){
  const c=C(),f=finals();if(!c)return 0;
  // niveau 1 : dé maximal ; niveaux suivants : valeur moyenne fixe (moitié du dé + 1)
  const lv=N(),con=md(f.con);
  let n=c.d+con+(lv-1)*Math.max(1,c.d/2+1+con);
  const e=E();
  if(e)[...e.fx,...((lig()||{}).fx||[])].forEach(x=>{if(x.t==='pv_niv')n+=x.n*lv});
  feats().forEach(([d])=>(d.fx||[]).forEach(x=>{if(x.t==='pv_niv')n+=x.n*lv}));
  return Math.max(1,n);
}
function pbSpent(){return ABK.reduce((t,k)=>t+COST[S.pb[k]],0)}
// Conseil : +2 dans la caractéristique principale de la classe si l'historique le permet
function bgDefaults(){
  const b=B();if(!b)return;
  const c=C(),pr=(c?c.p:[]).filter(k=>b.carac.includes(k));
  const order=[...pr,...b.carac.filter(k=>!pr.includes(k))];
  if(!b.carac.includes(S.bgch.a2))S.bgch.a2=order[0];
  if(!b.carac.includes(S.bgch.a1)||S.bgch.a1===S.bgch.a2)S.bgch.a1=order.find(k=>k!==S.bgch.a2);
}
function stdSuggest(){
  const c=C();if(!c)return;
  const pool=S.meth==='roll'&&S.rolls?S.rolls:STD;
  // les valeurs du tableau (triées) sont données dans l'ordre de priorité de la répartition conseillée
  const pri=ABK.slice().sort((a,b)=>c.std[ABK.indexOf(b)]-c.std[ABK.indexOf(a)]);
  const idx=pool.map((v,i)=>i).sort((a,b)=>pool[b]-pool[a]);
  pri.forEach((k,i)=>S.as[k]=idx[i]);
  // achat de points conseillé : 15, 14, 13, 12, 10, 8 coûte exactement 27 points
  if(S.meth==='pb')pri.forEach((k,i)=>S.pb[k]=STD[i]);
}

const optBtn=(on,act,v,title,sub,c)=>`<button type="button" class="opt" aria-pressed="${on}" data-act="${act}" data-v="${esc(v)}"${c?` style="--c:${c}"`:''}><b>${esc(title)}</b>${sub?`<small>${esc(sub)}</small>`:''}</button>`;
function sel(path,opts,cur,ph){
  return `<select data-set="${path}"><option value="">${esc(ph||'—')}</option>${opts.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${v===cur?' selected':''}>${esc(t)}</option>`}).join('')}</select>`;
}
// Choix d'une espèce ou d'un don (même format que la fiche : liste, carac, comp, texte)
function chHTML(path,c,cur){
  if(c.t==='texte')return `<label><small>${esc(c.lbl)}</small><input type="text" data-set="${path}.${c.id}" value="${esc(cur||'')}"></label>`;

function missing(){
  const m=[],c=C(),b=B(),e=E();
  if(!c)m.push('la classe');
  if(!b)m.push('l’historique');
  if(!e)m.push('l’espèce');
  if(c&&N()>=3&&subs().length&&!S.sc)m.push('la sous-classe');
  if(e&&e.lignage&&!S.lig)m.push(e.lignage.lbl.toLowerCase());
  if(e)e.choix.filter(x=>x.t!=='texte'&&!S.spch[x.id]).forEach(x=>m.push(x.lbl.toLowerCase()+' (espèce)'));
  if(S.esp==='Humain'&&!don(S.hfeat))m.push('le don d’origine de l’humain');
  if(b&&S.bgch.mode!=='+1 / +1 / +1'&&(!S.bgch.a2||!S.bgch.a1))m.push('les bonus de l’historique');
  if(S.meth==='roll'&&!S.rolls)m.push('les jets de caractéristiques');
  if(S.meth==='pb'&&pbSpent()>27)m.push('l’achat de points (plus de 27 points)');
  if(c&&S.sk.length<c.n)m.push((c.n-S.sk.length)+' compétence(s) de classe');
  if(c&&c.exp&&S.ex.length<c.exp)m.push('l’expertise');
  if(S.langs.length<2)m.push('les langues');
  return m;
}

function render(){
  if(S.done)return;
  $('#steps').innerHTML=STEPS.map(([t],i)=>`<button type="button" data-go="${i}"${i===S.step?' aria-current="step"':''}${i>S.max?' disabled':''} class="${i<S.max?'ok':''}">${i+1}. ${t}</button>`).join('');
  const last=S.step===STEPS.length-1;
  const need=[!C(),!B(),!E()][S.step];
  $('#main').innerHTML=STEPS[S.step][1]()+`<div class="nav"><button type="button" data-act="prev"${S.step?'':' disabled'}>← Précédent</button>${last?'<button type="button" class="primary" data-act="create">Créer le personnage</button>':`<button type="button" class="primary" data-act="next"${need?' disabled':''}>Suivant →</button>`}</div>`;

function build(){
  const c=C(),b=B(),e=E(),l=lig(),f=base(),nom=S.nom.trim()||(S.esp&&S.cl?S.cl+' '+S.esp.toLowerCase():'');
  const d={nom,niveau:String(N()),alignement:S.align};
  ABK.forEach(k=>d['ab_'+k]=String(f[k]));
  if(c){
    d.clsel=d.classe=S.cl;d.dvtot=N()+'d'+c.d;d.dvrest=String(N());
    if(N()>=3&&S.sc&&subs().includes(S.sc)){
      d.sclasse=d.sousclasse=S.sc;
      const sc=CLD&&CLD.classes[S.cl]&&CLD.classes[S.cl].sous_classe;   // tiers-lanceurs (Chevalier occulte, Arnaqueur arcanique…)
      if(sc&&new RegExp(sc.re||'occult|arcanique','i').test(S.sc))d.sclance=true;
    }
    d.pvmax=d.pv=String(hp());
    c.sv.forEach(k=>d['sv_'+k]=true);
    S.sk.forEach(n=>d['sk_'+SKN.indexOf(n)]=true);
    S.ex.forEach(n=>{d['sk_'+SKN.indexOf(n)]=true;d['ske_'+SKN.indexOf(n)]=true});
  }
  const sp={k:'',ch:{}};
  if(e){
    d.race=S.esp;d.sespece=S.lig||'';
    d.espece=l?S.esp+' ('+String(l.v).split(' (')[0]+')':S.esp;
    d.vitesse=fm(e.vit)+' m';
    Object.assign(sp,{k:S.esp,ch:Object.assign({},S.spch),auto:d.vitesse});
  }
  const bg={k:'',ch:{}},dons=[];
  const rid=()=>Math.random().toString(36).slice(2,8);
  if(b){
    d.bgsel=d.historique=S.bg;
    bg.k=S.bg;bg.ch={mode:S.bgch.mode||'+2 / +1',a2:S.bgch.a2||'',a1:S.bgch.a1||''};
    if(don(b.don))dons.push({u:rid(),id:b.don,ch:Object.assign({},b.don_ch||{},S.feat),bg:1});
  }
  if(S.esp==='Humain'&&don(S.hfeat))dons.push({u:rid(),id:S.hfeat,ch:Object.assign({},S.hfeatch)});
  asiLv().forEach(lv=>{const [x,ch]=asiAt(lv);if(x)dons.push({u:rid(),id:x.id,ch:Object.assign({},ch)})});
  d.langs=['Commun',...S.langs].join(', ');
  // Équipement : lot de classe + or ; le lot de l'historique est noté
  const items=new Map();let po=0;
  if(c&&c.eq[S.eq]){
    const o=c.eq[S.eq];po+=o[2];
    o[1].forEach(([n,q])=>{if(n==='@instrument')n=S.instr||'Luth';items.set(n,(items.get(n)||0)+q)});
  }
  const notes=[];
  if(b){if(S.bgeq==='po')po+=50;else notes.push('Lot d’équipement de l’historique '+S.bg+' (voir le Manuel des joueurs), dont : '+b.outil+'.')}
  if(S.cl==='Moine'&&S.eq===0)notes.push('Moine : un type d’outils d’artisan ou un instrument de musique au choix, à ajouter sur la page Équipement.');
  d.po=String(po);
  if(notes.length)d.notes=notes.join('\n');
  const parts={fiche:{version:5,type:'fiche-dnd-5e',data:Object.assign(d,{extras:{sp,bg,dons,spl:[],auto:{},mal:[],oh:{}}})}};
  if(items.size)parts.equipement={version:1,type:'equipement-dnd-5e',data:{titre:nom,objets:[...items].map(([n,qte])=>({n,qte})),filtres:{}}};
  return {nom,parts};
}
function create(){
  const m=missing();
  if(m.length&&!confirm('Il manque encore : '+m.join(', ')+'.\nCréer le personnage quand même ? (tu pourras compléter sur la fiche)'))return;
  const {nom,parts}=build();
  const p=Persos.add(nom,parts);
  try{localStorage.removeItem(DRAFT)}catch(e){}
  S.done=true;
  const caster=['Barde','Clerc','Druide','Ensorceleur','Magicien','Occultiste','Artificier','Paladin','Rôdeur'].includes(S.cl);
  $('#steps').innerHTML='';
  $('#main').innerHTML=`<div class="done"><h2>« ${esc(p.nom)} » est prêt !</h2><p class="lead">Le personnage est créé et sélectionné. Sur la fiche, ouvre les Paramètres pour ajuster les options restantes${N()<3?' (la sous-classe se choisit au niveau 3)':''}.</p>
   <div class="links"><a class="primary" href="fiche.html">Ouvrir la fiche</a>${caster?'<a href="grimoire.html">Choisir les sorts</a>':''}<a href="equipement.html">Voir l’équipement</a><a href="histoire.html">Écrire son histoire</a></div>
   <p style="margin-top:16px"><button type="button" class="opt" style="display:inline-block" data-act="again"><b>Créer un autre personnage</b></button></p></div>`;
}

/* ---------- Événements ---------- */
function setPath(path,v){
  const [a,b]=path.split('.');
  const m=/^ac(\d+)$/.exec(a);
  if(m&&!S[a])S[a]=Object.assign({},asiAt(+m[1])[1]);   // garde les choix proposés par défaut
  if(b){S[a]=S[a]||{};S[a][b]=v}else S[a]=v;
}
document.addEventListener('click',ev=>{
  const g=ev.target.closest('[data-go]');if(g){go(+g.dataset.go);return}
  const t=ev.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,v=t.dataset.v;
  if(a==='cl'){if(S.cl!==v){S.cl=v;S.sc='';S.sk=[];S.ex=[];S.eq=0;stdSuggest();bgDefaults()}}
  else if(a==='bg'){if(S.bg!==v){S.bg=v;S.feat={};S.bgch={mode:S.bgch.mode||'+2 / +1'};bgDefaults()}}
  else if(a==='esp'){if(S.esp!==v){S.esp=v;S.lig='';S.spch={}}}
  else if(a==='mode'){S.bgch.mode=v;bgDefaults()}
  else if(a==='meth'){S.meth=v;if(v!=='pb')S.as={for:0,dex:1,con:2,int:3,sag:4,cha:5};stdSuggest()}
  else if(a==='sugg')stdSuggest();
  else if(a==='roll'){
    S.rolls=Array.from({length:6},()=>{const r=[0,0,0,0].map(()=>1+Math.floor(Math.random()*6)).sort((x,y)=>y-x);return r[0]+r[1]+r[2]});
    S.as={for:0,dex:1,con:2,int:3,sag:4,cha:5};stdSuggest();
  }
  else if(a==='pb+'||a==='pb-'){
    const n=S.pb[v]+(a==='pb+'?1:-1);
    if(n<8||n>15)return;
    if(a==='pb+'&&pbSpent()-COST[S.pb[v]]+COST[n]>27){msg('Plus assez de points');return}
    S.pb[v]=n;
  }
  else if(a==='prev'){go(S.step-1);return}
  else if(a==='next'){go(S.step+1);return}
  else if(a==='create'){create();return}
  else if(a==='again'){S=blank();render();return}
  else return;
  render();
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.set){
    setPath(t.dataset.set,t.value);
    if(t.dataset.set==='esp'){S.lig='';S.spch={}}
    if(t.dataset.set==='bgch.a2')bgDefaults();
    if(t.dataset.set==='hfeat')S.hfeatch={};
    if(t.dataset.set.startsWith('asi.'))delete S['ac'+t.dataset.set.slice(4)];
    if(t.type==='text'){keep();return}   // texte libre : pas de rendu (garde le curseur)
    render();return;
  }
  if(t.dataset.as){   // tableau standard / jets : la valeur prise ailleurs est échangée
    const k=t.dataset.as,j=+t.value,o=ABK.find(x=>x!==k&&S.as[x]===j);
    if(o)S.as[o]=S.as[k];
    S.as[k]=j;render();return;
  }
  if(t.dataset.sk){const n=t.dataset.sk;S.sk=t.checked?[...S.sk,n]:S.sk.filter(x=>x!==n);render();return}
  if(t.dataset.ex){const n=t.dataset.ex;S.ex=t.checked?[...S.ex,n]:S.ex.filter(x=>x!==n);render();return}
  if(t.dataset.lang){const n=t.dataset.lang;S.langs=t.checked?[...S.langs,n]:S.langs.filter(x=>x!==n);render();return}
  if(t.dataset.eq!==undefined){S.eq=+t.dataset.eq;render();return}
  if(t.dataset.bgeq){S.bgeq=t.dataset.bgeq;render();return}
});
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.set&&t.type==='text'){setPath(t.dataset.set,t.value);keep()}});
$('#bRestart').onclick=()=>{if(!confirm('Tout recommencer depuis le début ?'))return;S=blank();try{localStorage.removeItem(DRAFT)}catch(e){}render();msg('Création recommencée')};

(async function boot(){
  const get=async f=>{const r=await fetch(f);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
  try{[ESP,BG,DON,SCD,CLD]=await Promise.all([get('especes.json'),get('historiques.json'),get('dons.json'),get('sousclasses.json'),get('classes.json')])}
  catch(e){$('#main').innerHTML='<p class="warn">Impossible de charger les données (ouvre le site via un serveur web).</p>';return}
  if(!CL[S.cl])S.cl='';if(!BG[S.bg])S.bg='';if(!ESP[S.esp])S.esp='';
  render();
})();
