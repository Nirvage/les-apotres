<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Objets magiques D&amp;D 5e</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261014c">
<link rel="stylesheet" href="assets/css/pages/objets.css?v=20261022r">
<script src="assets/js/theme.js?v=20261022s"></script>
<script src="assets/js/vo.js?v=20261022s"></script>
</head>
<body data-mode="choose">
<div class="top">
 <div class="bar">
  <a class="home" href="./">← Accueil</a>
  <b>Objets magiques D&amp;D 5e</b>
  <span id="msg" role="status"></span>
  <button data-act="mode" data-m="choose" aria-pressed="true">Choisir les objets</button>
  <button data-act="mode" data-m="book" aria-pressed="false" id="bBook">Mes objets (0)</button>
  <button class="primary" id="bSave">Enregistrer (.json)</button>
  <button id="bLoad">Charger un .json</button>
  <button id="bPrint">Imprimer</button>
  <button id="bClear">Vider</button>
  <input type="file" id="file" accept="application/json,.json" hidden>
 </div>
 <div class="persos" id="persos"></div>
</div>

<!-- CHOISIR -->
<div id="choose" class="wrap">
 <section class="panel">
  <h2>Rechercher des objets magiques</h2>
  <div class="fgrid">
   <label><small>Nom</small><input id="fq" type="search" placeholder="Sac sans fond, cape, épée…"></label>
   <label><small>Type</small><select id="fc"></select></label>
   <label><small>Rareté</small><select id="fs"></select></label>
   <label><small>Famille (début du nom)</small><select id="ff"></select></label>
   <label><small>Conseillé pour la classe</small><select id="fk"></select></label>
   <label><small>Rôle</small><select id="fr"></select></label>
   <label><small>Harmonisation</small><select id="fl"><option value="">Indifférent</option><option value="1">Requise</option><option value="0">Non requise</option></select></label>
  </div>
  <div class="fbar">
   <span class="cnt" id="cnt"></span>
   <label>Source&nbsp;<select id="fb"><option value="">toutes</option><option value="base">règles 5.5 (Guide du Maître 2024)</option><option value="2014">anciens livres, version 2014</option><option value="perso">mes créations</option></select></label>
   <label>Afficher&nbsp;<select id="fo"><option value="">tous les objets</option><option value="1">ma sélection</option></select></label>
   <button class="b" id="bRand" style="--c:#7a4fc4" title="Tire au hasard un objet parmi ceux qui correspondent à la recherche et aux filtres">🎲 Objet au hasard</button>
   <button class="b" id="bReset">Réinitialiser les filtres</button>
   <button class="b add" id="bNew" title="Crée ton propre objet magique : il sera disponible pour tous tes personnages">+ Créer un objet</button>
  </div>
 </section>
 <div class="list" id="list"><div class="empty-msg">Chargement des objets…</div></div>
</div>

<!-- GRIMOIRE -->
<div id="book" class="wrap">
 <main class="sheet">
  <div class="hero">
   <input id="titre" placeholder="Nom du personnage" aria-label="Nom du personnage">
   <p id="sum"></p>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="levels"></div>
 </main>
</div>

<script src="assets/js/persos.js?v=20261022s"></script>
<script src="assets/js/custom.js?v=20261022s"></script>
<script src="assets/js/pages/objets.js?v=20261022r"></script>
<script src="assets/js/recherche.js?v=20261022s"></script>
<script src="assets/js/sw-register.js?v=20261022s"></script>
</body>
</html>
